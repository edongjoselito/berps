name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version (e.g. 1.0.0)"
        required: true

env:
  APP_DIR: BERPS-FLUTTER-PROJECT
  API_URL: https://berps.online

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: prepare
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS app
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build macos --release \
            --dart-define=BERPS_DEFAULT_BASE_URL=${{ env.API_URL }}
      - name: Package DMG
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p dist staging
          cp -R "build/macos/Build/Products/Release/BERPS.app" staging/
          ln -s /Applications staging/Applications
          cp "build/macos/Build/Products/Release/BERPS.app/Contents/Resources/AppIcon.icns" \
            staging/.VolumeIcon.icns
          SetFile -a C staging || true
          hdiutil create -volname BERPS -srcfolder staging -ov -format UDZO \
            "dist/BERPS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.APP_DIR }}/dist/BERPS.dmg

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows app
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter doctor -v
          flutter pub get
          flutter build windows --release --dart-define=BERPS_DEFAULT_BASE_URL=${{ env.API_URL }}
      - name: Build installer
        working-directory: ${{ env.APP_DIR }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ env.APP_VERSION }}" packaging/BERPS.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.APP_DIR }}/dist/BERPS-Setup.exe

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
      - name: Build Linux app
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release \
            --dart-define=BERPS_DEFAULT_BASE_URL=${{ env.API_URL }}
      - name: Package .deb
        working-directory: ${{ env.APP_DIR }}
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          PKG="dist/berps_${APP_VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/lib/berps" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE"/. "$PKG/usr/lib/berps/"
          ln -sf /usr/lib/berps/berps "$PKG/usr/bin/berps"
          cp assets/logo.png \
            "$PKG/usr/share/icons/hicolor/256x256/apps/berps.png"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: berps
          Version: ${APP_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: SoftTech Services <support@berps.online>
          Depends: libgtk-3-0
          Description: BERPS staff desktop client
           Tasks, attendance, tickets, and goals in a native window.
          EOF
          cat > "$PKG/usr/share/applications/berps.desktop" <<EOF
          [Desktop Entry]
          Name=BERPS
          Exec=berps
          Icon=berps
          Type=Application
          Categories=Office;
          EOF
          dpkg-deb --build "$PKG"
          mv "$PKG.deb" "dist/BERPS-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ env.APP_DIR }}/dist/BERPS-amd64.deb

  release:
    needs: [prepare, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: BERPS Desktop ${{ env.APP_VERSION }}
          files: artifacts/**/*
