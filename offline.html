<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f5bc6">
    <title>Offline - BERPS</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #17233b;
            background: #f3f6fc;
        }
        body {
            box-sizing: border-box;
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
        }
        main {
            width: min(100%, 440px);
            padding: 32px;
            border: 1px solid #dce5f3;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 16px 40px rgba(23, 35, 59, .1);
            text-align: center;
        }
        h1 { margin: 0 0 12px; color: #1f5bc6; font-size: 1.5rem; }
        p { margin: 0 0 24px; line-height: 1.6; color: #5c6b82; }
        button {
            border: 0;
            border-radius: 9px;
            padding: 11px 18px;
            background: #1f5bc6;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>You’re offline</h1>
        <p>Reconnect to the internet to open this page. Previously visited dashboards, your tasks, calendar, and Knowledge Base may still be available from the app.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
