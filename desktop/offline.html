<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BERPS Staff</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: #f4f5f7; color: #1a2942;
    }
    .card { text-align: center; max-width: 360px; padding: 32px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; color: #5b6b82; margin-bottom: 24px; }
    button {
      background: #1f5bc6; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 28px; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #174aa6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Can't reach BERPS</h1>
    <p>Check your internet connection, then try again.</p>
    <button onclick="window.location.href='https://berps.online/page/staff'">Retry</button>
  </div>
</body>
</html>
