<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BERPS Staff — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(120% 100% at 80% -10%, rgba(96, 140, 255, 0.14) 0%, transparent 55%),
        linear-gradient(160deg, #f3f6fc 0%, #e8eef9 100%);
      color: #101f3c;
      -webkit-app-region: drag;
    }
    .card {
      text-align: center;
      max-width: 400px;
      padding: 48px 40px;
      background: #fff;
      border-radius: 18px;
      border: 1px solid #e3e8f2;
      box-shadow: 0 24px 60px rgba(16, 31, 60, 0.12);
      -webkit-app-region: no-drag;
    }
    .mark {
      object-fit: contain; padding: 10px; background: #fff !important;
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #3b82f6, #2563eb 60%, #1d4ed8);
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
    }
    h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
    p { font-size: 14px; color: #5a6b88; margin: 0 0 24px; line-height: 1.5; }
    button {
      background: #2563eb; color: #fff; border: 0; border-radius: 10px;
      padding: 11px 30px; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background-color .15s ease, transform .12s ease;
    }
    button:hover { background: #1d4ed8; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button.ghost { background: #fff; color: #2563eb; border: 1px solid #c7d7fd; }
    button.ghost:hover { background: #eef3ff; }
    button:active { transform: translateY(1px); }
    .status {
      margin-top: 18px;
      font-size: 12px;
      color: #8b98b0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #d23449;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .dot.ok { background: #12805c; animation: none; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <div class="card">
    <img class="mark" src="app/logo.png" alt="BERPS">
    <h1>Can't reach BERPS</h1>
    <p>Check your internet connection. We'll keep trying in the background and take you back automatically.</p>
    <div class="actions"><button id="retry">Retry now</button><button id="backApp" class="ghost">Back to BERPS Desk</button></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Reconnecting…</span></div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var ORIGIN = params.get('origin') || 'https://berps.online';
    var TARGET = params.get('target') || '';
    var PORTAL = TARGET.indexOf(ORIGIN) === 0 ? TARGET : ORIGIN + '/page/staff';
    var dot = document.getElementById('dot');
    var text = document.getElementById('statusText');

    function go() { window.location.href = PORTAL; }

    async function probe() {
      try {
        await fetch(ORIGIN, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
        dot.classList.add('ok');
        text.textContent = 'Back online — loading portal…';
        setTimeout(go, 600);
      } catch (_) {
        text.textContent = 'Reconnecting…';
      }
    }

    document.getElementById('retry').addEventListener('click', go);
    document.getElementById('backApp').addEventListener('click', function () {
      if (window.berps && window.berps.portal) window.berps.portal.openApp();
    });
    setInterval(probe, 10000);
    probe();
  </script>
</body>
</html>
