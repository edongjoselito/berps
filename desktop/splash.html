<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BERPS Staff</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(120% 100% at 80% -10%, rgba(96, 140, 255, 0.22) 0%, transparent 55%),
        linear-gradient(160deg, #0d1830 0%, #17284d 100%);
      user-select: none;
      -webkit-app-region: drag;
    }
    .mark {
      object-fit: contain; padding: 10px; background: #fff !important;
      width: 84px;
      height: 84px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #3b82f6, #2563eb 60%, #1d4ed8);
      box-shadow: 0 20px 50px rgba(37, 99, 235, 0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }
    .name small {
      display: block;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.42em;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
    }
    .bar {
      width: 180px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, transparent, #7da6ff, transparent);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .status {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <img class="mark" src="app/logo.png" alt="BERPS">
  <div class="name">BERPS<small>STAFF PORTAL</small></div>
  <div class="bar"></div>
  <div class="status">Connecting to the portal…</div>
</body>
</html>
